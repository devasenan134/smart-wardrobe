# Maps Fashionpedia labels INTO our taxonomy (taxonomy.yaml).
# Keys are Fashionpedia names exactly as they appear in
# instances_attributes_*2020.json. Match on names, not ids.
# Anything not listed here is ignored.
version: 1
source: fashionpedia-2020

# Fashionpedia category -> our category, or drop
categories:
  "shirt, blouse": shirt
  "top, t-shirt, sweatshirt": top
  sweater: top  # mid layer, see outfit_roles in taxonomy.yaml
  cardigan: top
  jacket: outerwear
  vest: outerwear
  coat: outerwear
  cape: outerwear
  pants: pants
  shorts: pants
  skirt: skirt
  dress: dress
  jumpsuit: dress
  shoe: shoes
  "bag, wallet": bag
  glasses: accessory
  hat: accessory
  "headband, head covering, hair accessory": accessory
  tie: accessory
  glove: accessory
  watch: accessory
  belt: accessory
  sock: accessory
  scarf: accessory
  "tights, stockings": accessory
  "leg warmer": drop
  umbrella: drop
  # garment parts, closures and decorations are not garments
  hood: drop
  collar: drop
  lapel: drop
  epaulette: drop
  sleeve: drop  # but used below to derive sleeve_length
  pocket: drop
  neckline: drop
  buckle: drop
  zipper: drop
  applique: drop
  bead: drop
  bow: drop
  flower: drop
  fringe: drop
  ribbon: drop
  rivet: drop
  ruffle: drop
  sequin: drop
  tassel: drop

# Fashionpedia attribute (on the garment itself) -> {our attribute: value}
# Grouped by OUR attribute. Unused ones are in dropped_attributes below.
attributes:
  # --- subtype ---  item type inside the category - grouped by our category
  # top
  "classic (t-shirt)": {subtype: t-shirt}
  "polo (shirt)": {subtype: polo}
  "ringer (t-shirt)": {subtype: t-shirt}
  "raglan (t-shirt)": {subtype: t-shirt}
  "crop (top)": {subtype: crop_top}
  "camisole": {subtype: camisole}
  "tank (top)": {subtype: tank_top}
  "hoodie": {subtype: hoodie}
  # skirt
  "wrap (skirt)": {subtype: wrap_skirt}
  "skater (skirt)": {subtype: skater_skirt}
  "hobble (skirt)": {subtype: pencil_skirt}
  "sheath (skirt)": {subtype: pencil_skirt}
  "ball gown (skirt)": {subtype: full_skirt}
  "gypsy (skirt)": {subtype: full_skirt}
  "rah-rah (skirt)": {subtype: skater_skirt}
  "prairie (skirt)": {subtype: full_skirt}
  "accordion (skirt)": {subtype: pleated_skirt}
  "sarong (skirt)": {subtype: wrap_skirt}
  "dirndl (skirt)": {subtype: full_skirt}
  # pants
  "jeans": {subtype: jeans, material: denim}
  "sweatpants": {subtype: sweat_pants}
  "leggings": {subtype: leggings}
  "cargo (pants)": {subtype: cargo_pants}
  "culottes": {subtype: culottes}
  "capri (pants)": {subtype: capri}
  "track (pants)": {subtype: track_pants}
  "short (shorts)": {subtype: shorts}
  "bermuda (shorts)": {subtype: bermuda_shorts}
  "cargo (shorts)": {subtype: cargo_shorts}
  "roll-up (shorts)": {subtype: shorts}
  "lounge (shorts)": {subtype: lounge_shorts}
  # dress
  "shirt (dress)": {subtype: shirt_dress}
  "sundress": {subtype: sundress}
  "gown": {subtype: gown}
  "sweater (dress)": {subtype: sweater_dress}
  # outerwear
  "blazer": {subtype: blazer}
  "puffer (jacket)": {subtype: puffer}
  "biker (jacket)": {subtype: biker_jacket}
  "trucker (jacket)": {subtype: denim_jacket}
  "bomber (jacket)": {subtype: bomber_jacket}
  "track (jacket)": {subtype: track_jacket}
  "tuxedo (jacket)": {subtype: blazer}
  "parka": {subtype: parka}
  "trench (coat)": {subtype: trench_coat}
  "puffer (coat)": {subtype: puffer}

  # --- pattern ---
  "plain (pattern)": {pattern: solid}
  "stripe": {pattern: striped}
  "check": {pattern: checked}
  "houndstooth (pattern)": {pattern: checked}
  "argyle": {pattern: checked}
  "floral": {pattern: floral}
  "plant": {pattern: floral}
  "dot": {pattern: polka_dot}
  "cartoon": {pattern: graphic}
  "letters, numbers": {pattern: graphic}
  "leopard": {pattern: animal_print}
  "cheetah": {pattern: animal_print}
  "zebra": {pattern: animal_print}
  "giraffe": {pattern: animal_print}
  "snakeskin (pattern)": {pattern: animal_print}
  "peacock": {pattern: animal_print}
  "camouflage": {pattern: camouflage}
  "abstract": {pattern: abstract}
  "geometric": {pattern: abstract}
  "paisley": {pattern: other}
  "fair isle": {pattern: other}
  "chevron": {pattern: other}
  "herringbone (pattern)": {pattern: other}
  "toile de jouy": {pattern: other}

  # --- fit ---  Fashionpedia labels fit on tops, jackets, dresses too, not only pants
  "tight (fit)": {fit: skinny}
  "regular (fit)": {fit: regular}
  "loose (fit)": {fit: loose}
  "baggy": {fit: baggy}
  "oversized": {fit: oversized}

  # --- material ---  Fashionpedia has no fabric labels, only these few (jeans -> denim is under subtype)
  "suede": {material: suede}
  "shearling": {material: leather}
  "crocodile": {material: leather}
  "snakeskin": {material: leather}

  # --- length ---  garment length; read together with the category
  "above-the-hip (length)": {length: above_hip}
  "hip (length)": {length: hip}
  "micro (length)": {length: mini}
  "mini (length)": {length: mini}
  "above-the-knee (length)": {length: mini}
  "knee (length)": {length: knee}
  "below the knee (length)": {length: knee}
  "midi": {length: midi}
  "maxi (length)": {length: maxi}
  "floor (length)": {length: maxi}

  # --- silhouette ---  only the shapes that matter; symmetrical/asymmetrical etc. are dropped
  "circle": {silhouette: flare}
  "flare": {silhouette: flare}
  "fit and flare": {silhouette: fit_and_flare}
  "trumpet": {silhouette: flare}
  "mermaid": {silhouette: flare}
  "bell": {silhouette: flare}
  "bell bottom": {silhouette: wide_leg}
  "bootcut": {silhouette: wide_leg}
  "pencil": {silhouette: pencil}
  "straight": {silhouette: straight}
  "a-line": {silhouette: a_line}
  "wide leg": {silhouette: wide_leg}

  # --- waist_rise ---
  "high waist": {waist_rise: high}
  "normal waist": {waist_rise: mid}
  "low waist": {waist_rise: low}

