# Some Fashionpedia categories already tell the subtype (e.g. shorts -> pants/shorts).
# A subtype from a garment's nickname attribute wins over this
# (jacket + "blazer" -> blazer, not jacket).
# No default on purpose for "shirt, blouse", "top, t-shirt, sweatshirt" and
# "pants": they mix several subtypes, so any single default would be wrong for
# part of them. Those garments get a subtype only from a nickname; the rest stay
# empty (unknown), and the subtype model skips them during training.
category_subtypes:
  sweater: sweater
  cardigan: cardigan
  jacket: jacket
  vest: vest
  coat: coat
  cape: cape
  shorts: shorts
  jumpsuit: jumpsuit
  dress: dress
  skirt: skirt
  shoe: shoe
  "bag, wallet": bag
  glasses: glasses
  hat: hat
  "headband, head covering, hair accessory": hair_accessory
  tie: tie
  glove: glove
  watch: watch
  belt: belt
  sock: sock
  scarf: scarf
  "tights, stockings": tights

# sleeve_length is NOT labelled on the garment. Fashionpedia labels it on
# separate "sleeve" objects, so each sleeve has to be matched to the garment
# it sits on (e.g. by box overlap). A garment with no sleeve objects inside
# it is most likely sleeveless.
# Fashionpedia attribute on "sleeve" objects -> our sleeve_length
sleeve_length:
  sleeveless: sleeveless
  "short (length)": short
  elbow-length: short
  "three quarter (length)": three_quarter
  wrist-length: long

# neckline works like sleeve_length: it is labelled on separate "neckline"
# objects, which have to be matched to the garment they sit on.
# Fashionpedia attribute on "neckline" objects -> our neckline
neckline:
  "round (neck)": round
  "crew (neck)": round
  "oval (neck)": round
  "v-neck": v_neck
  "plunging (neckline)": v_neck
  "surplice (neck)": v_neck
  "crossover (neck)": v_neck
  "scoop (neck)": scoop
  "u-neck": scoop
  "boat (neck)": boat
  "straight across (neck)": boat
  "square (neckline)": square
  "sweetheart (neckline)": sweetheart
  "queen anne (neck)": sweetheart
  "high (neck)": high
  "turtle (neck)": high
  "choker (neck)": high
  "off-the-shoulder": off_shoulder
  "one shoulder": one_shoulder
  "halter (neck)": halter
  "asymmetric (neckline)": other
  "illusion (neck)": other
  "keyhole (neck)": other
  "cowl (neck)": other

# Not in Fashionpedia at all - needs another source:
